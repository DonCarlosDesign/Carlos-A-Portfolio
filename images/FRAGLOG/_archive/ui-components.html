<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#0a0806; font-family:'JetBrains Mono','IBM Plex Mono',monospace; }
  .wrap { background:#14100a; border-radius:12px; padding:28px; color:#e6d9c4; }
  .label { font-size:11px; color:#8e7a56; letter-spacing:1px; margin-bottom:10px; }
  .row { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
  button { font-family:'JetBrains Mono','IBM Plex Mono',monospace; font-size:13px; padding:10px 18px; border-radius:2px; letter-spacing:0.5px; cursor:pointer; }
  .btn-primary { background:#f0a93e; color:#1a1207; border:none; font-weight:700; }
  .btn-secondary { background:transparent; color:#e6d9c4; border:1px solid #3a2f1c; }
  .btn-disabled { background:transparent; color:#6a5b41; border:1px solid #241d11; }
  .tag { padding:4px 10px; font-size:12px; border-radius:2px; }
  .tag-win { background:#2a1f0d; color:#f0a93e; }
  .tag-loss { background:#2a1710; color:#c85a3e; }
  .tag-pending { background:#1c1a15; color:#8e7a56; }
  .tag-mvp { background:#2a1f0d; color:#f0a93e; font-weight:700; }
  .badges { display:flex; gap:16px; margin-bottom:24px; }
  .badge { width:48px; height:48px; border:1px solid #3a2f1c; display:flex; align-items:center; justify-content:center; font-size:10px; color:#8e7a56; }
  .badge-active { border:1px solid #f0a93e; color:#f0a93e; font-weight:700; }
  input { background:#1c1811; border:1px solid #3a2f1c; color:#e6d9c4; padding:10px 12px; font-family:'JetBrains Mono','IBM Plex Mono',monospace; font-size:13px; width:100%; box-sizing:border-box; border-radius:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">buttons</div>
    <div class="row">
      <button class="btn-primary">view_match</button>
      <button class="btn-secondary">export_log</button>
      <button class="btn-disabled">disabled</button>
    </div>

    <div class="label">status tags</div>
    <div class="row">
      <span class="tag tag-win">win</span>
      <span class="tag tag-loss">loss</span>
      <span class="tag tag-pending">pending</span>
      <span class="tag tag-mvp">mvp</span>
    </div>

    <div class="label">rank badges</div>
    <div class="badges">
      <div class="badge">IRON</div>
      <div class="badge badge-active">RDNT</div>
    </div>

    <div class="label">input field</div>
    <input placeholder="search operator id" />
  </div>
</body>
</html>
