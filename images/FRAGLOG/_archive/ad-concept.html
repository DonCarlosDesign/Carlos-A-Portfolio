<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#0a0806; font-family:'JetBrains Mono','IBM Plex Mono',monospace; }
  .wrap { background:#14100a; border-radius:12px; padding:36px; color:#e6d9c4; position:relative; overflow:hidden; }
  .eyebrow { font-size:11px; color:#8e7a56; letter-spacing:1px; margin-bottom:18px; }
  .headline { font-size:40px; font-weight:700; line-height:1.15; margin-bottom:8px; }
  .amber { color:#f0a93e; }
  .body { font-size:13px; color:#8e7a56; margin-bottom:24px; max-width:340px; }
  button { background:#f0a93e; color:#1a1207; border:none; padding:12px 22px; font-family:'JetBrains Mono','IBM Plex Mono',monospace; font-size:13px; font-weight:700; border-radius:2px; cursor:pointer; }
  .wm { position:absolute; right:24px; bottom:24px; font-size:11px; color:#3a2f1c; letter-spacing:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">operator_check // radiant tier</div>
    <div class="headline">know your<br/><span class="amber">frag</span>_efficiency.</div>
    <div class="body">round-by-round breakdowns, agent performance, and rank history — logged automatically, every match.</div>
    <button>track_now &gt;</button>
    <div class="wm">frag<span class="amber">.</span>log</div>
  </div>
</body>
</html>
