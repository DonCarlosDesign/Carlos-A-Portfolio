<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#0a0806; font-family:'JetBrains Mono','IBM Plex Mono',monospace; }
  .wrap { background:#14100a; border-radius:12px; padding:40px; display:flex; align-items:center; justify-content:center; min-height:120px; }
  .mark { font-size:44px; font-weight:700; color:#e6d9c4; letter-spacing:1px; }
  .amber { color:#f0a93e; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">frag<span class="amber">.</span>log<span class="amber cursor">_</span></div>
  </div>
</body>
</html>
