<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#0a0806; font-family:'JetBrains Mono','IBM Plex Mono',monospace; }
  .wrap { background:#14100a; border-radius:12px; padding:28px; color:#e6d9c4; }
  .label { font-size:11px; color:#8e7a56; letter-spacing:1px; margin-bottom:16px; }
  .bars { display:flex; align-items:flex-end; gap:8px; height:60px; }
  .bar { width:24px; }
  .axis { display:flex; gap:8px; margin-top:6px; font-size:9px; color:#6a5b41; }
  .axis span { width:24px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">rank progression // last 14 days</div>
    <svg viewBox="0 0 560 160" style="width:100%; height:auto;">
      <line x1="0" y1="0" x2="0" y2="160" stroke="#241d11" stroke-width="1"/>
      <line x1="0" y1="160" x2="560" y2="160" stroke="#241d11" stroke-width="1"/>
      <line x1="0" y1="40" x2="560" y2="40" stroke="#241d11" stroke-width="1" stroke-dasharray="2,4"/>
      <line x1="0" y1="90" x2="560" y2="90" stroke="#241d11" stroke-width="1" stroke-dasharray="2,4"/>
      <line x1="0" y1="130" x2="560" y2="130" stroke="#241d11" stroke-width="1" stroke-dasharray="2,4"/>
      <polyline points="0,130 60,120 120,125 180,95 240,100 300,70 360,80 420,55 480,60 540,35"
        fill="none" stroke="#f0a93e" stroke-width="2"/>
      <circle cx="540" cy="35" r="4" fill="#f0a93e"/>
      <text x="545" y="30" fill="#f0a93e" font-size="11" font-family="monospace">radiant</text>
      <text x="0" y="150" fill="#6a5b41" font-size="10" font-family="monospace">jul 8</text>
      <text x="500" y="150" fill="#6a5b41" font-size="10" font-family="monospace">jul 22</text>
    </svg>

    <div style="margin-top:20px;">
      <div class="label">win rate by map</div>
      <div class="bars">
        <div class="bar" style="height:70%; background:#f0a93e;"></div>
        <div class="bar" style="height:45%; background:#f0a93e;"></div>
        <div class="bar" style="height:85%; background:#f0a93e;"></div>
        <div class="bar" style="height:30%; background:#c85a3e;"></div>
        <div class="bar" style="height:60%; background:#f0a93e;"></div>
      </div>
      <div class="axis">
        <span>A</span><span>B</span><span>H</span><span>S</span><span>L</span>
      </div>
    </div>
  </div>
</body>
</html>
