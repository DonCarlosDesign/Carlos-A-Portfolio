<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/frag-log-design-system-92506885-8d53-4caa-aeb8-26bce4b130e1/tokens/colors.css">
  <link rel="stylesheet" href="_ds/frag-log-design-system-92506885-8d53-4caa-aeb8-26bce4b130e1/tokens/typography.css">
  <link rel="stylesheet" href="_ds/frag-log-design-system-92506885-8d53-4caa-aeb8-26bce4b130e1/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/frag-log-design-system-92506885-8d53-4caa-aeb8-26bce4b130e1/tokens/base.css">
  <link rel="stylesheet" href="_ds/frag-log-design-system-92506885-8d53-4caa-aeb8-26bce4b130e1/styles.css">
  <script src="_ds/frag-log-design-system-92506885-8d53-4caa-aeb8-26bce4b130e1/_ds_bundle.js"></script>
</helmet>
<div style="background:var(--c-bg-base);min-height:100vh;font-family:var(--font-mono);color:var(--text-primary)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border-default)">
    <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.Wordmark" size="{{ 20 }}" hint-size="140px,24px"></x-import>
    <div style="display:flex;gap:24px">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
        <span style="cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:lowercase;color:{{ tab.color }};border-bottom:{{ tab.border }};padding-bottom:4px">{{ tab.name }}</span>
      </sc-for>
    </div>
  </div>

  <div style="padding:32px">
    <div style="display:flex;gap:96px;margin-bottom:48px">
      <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.StatTile" label="current rank" value="radiant" accent="{{ true }}" hint-size="200px,80px"></x-import>
      <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.StatTile" label="win rate // 30d" value="64%" hint-size="200px,80px"></x-import>
      <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.StatTile" label="k/d ratio" value="1.32" hint-size="200px,80px"></x-import>
    </div>

    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:48px;margin-bottom:8px">
      <div>
        <div style="font-size:12px;color:var(--text-secondary);text-transform:lowercase;letter-spacing:1px;margin-bottom:12px">rank progression // last 14 days</div>
        <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.LineChart" data="{{ rankData }}" label-start="jul 8" label-end="jul 22" end-label="radiant" hint-size="100%,220px"></x-import>
      </div>
      <div>
        <div style="font-size:12px;color:var(--text-secondary);text-transform:lowercase;letter-spacing:1px;margin-bottom:12px">win rate by map</div>
        <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.BarChart" bars="{{ mapBars }}" hint-size="100%,180px"></x-import>
      </div>
    </div>

    <div style="border-top:1px solid var(--border-default);margin-top:32px;padding-top:24px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-size:12px;color:var(--text-secondary);text-transform:lowercase;letter-spacing:1px">recent matches</div>
        <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.Button" variant="secondary" hint-size="auto,40px">export_log</x-import>
      </div>
      <sc-for list="{{ matches }}" as="m" hint-placeholder-count="5">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px;background:{{ m.rowBg }};border-bottom:1px solid var(--border-default)">
          <span style="width:120px">{{ m.map }}</span>
          <x-import component-from-global-scope="FRAGLOGDesignSystem_925068.StatusTag" kind="{{ m.result }}" hint-size="70px,24px">{{ m.result }}</x-import>
          <span style="width:80px;text-align:right">{{ m.kd }}</span>
          <span style="width:100px;text-align:right;color:var(--text-muted)">{{ m.time }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['overview','match','agents','leaderboard','profile'].map(name => ({
      name,
      color: name === 'overview' ? 'var(--c-amber)' : 'var(--text-secondary)',
      border: name === 'overview' ? '1px solid var(--c-amber)' : '1px solid transparent',
    }));
    const matches = [
      { map: 'ascent', result: 'win', kd: '1.42', time: '2h ago' },
      { map: 'bind', result: 'loss', kd: '0.88', time: '5h ago' },
      { map: 'haven', result: 'win', kd: '1.15', time: '1d ago' },
      { map: 'split', result: 'win', kd: '1.61', time: '1d ago' },
      { map: 'sunset', result: 'pending', kd: '—', time: 'in progress' },
    ].map((m, i) => ({ ...m, rowBg: i % 2 ? 'var(--c-bg-row)' : 'transparent' }));
    const mapBars = [
      { label: 'ascent', value: 62 },
      { label: 'bind', value: 48 },
      { label: 'haven', value: 71 },
      { label: 'sunset', value: 39, below: true },
      { label: 'split', value: 55 },
    ];
    return {
      tabs,
      matches,
      mapBars,
      rankData: [10, 12, 11, 18, 22, 20, 26, 24, 30],
    };
  }
}

</script>
</body>
</html>
